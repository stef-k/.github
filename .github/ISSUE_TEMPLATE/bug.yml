# .github/ISSUE_TEMPLATE/bug.yml
name: Bug report
description: Something is broken
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs/screenshots (optional)
    validations:
      required: false
