# .github/ISSUE_TEMPLATE/bug.yml
name: Bug report
description: Something is broken
title: "[Bug]: "
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Version / environment (optional)
      description: Version, commit, OS, browser, runtime, device, or other relevant environment details.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs/screenshots (optional)
    validations:
      required: false
